server:
  forward-headers-strategy: framework
  error:
    path: /error-page
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  profiles:
    active: dev  # 기본값은 로컬용 dev
  threads:
    virtual:
      enabled: true
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
      cache:
        period: 3600
        cachecontrol:
          max-age: 3600
          cache-public: true
  thymeleaf:
    cache: false
  sql:
    init:
      mode: never
      schema-locations: classpath:eval-schema.sql
      data-locations: classpath:truncate_data.sql, classpath:eval-data.sql
      encoding: UTF-8

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.ees.eval: INFO

---
# [dev] 로컬 개발 환경 - 학교 공용 DB
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:sqlserver://211.232.94.161:1533;databaseName=SKUEDU;encrypt=true;trustServerCertificate=true;
    username: SKUEDU01
    password: init000!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  docker:
    compose:
      enabled: false

---
# [prod] Azure 운영 환경 - Azure SQL DB
spring:
  config:
    activate:
      on-profile: prod
  sql:
    init:
      mode: never  # 테이블 생성이 완료되었으므로 안전을 위해 never로 원복
  datasource:
    # Azure CLI로 확인한 정보 반영
    url: jdbc:sqlserver://ees-server-hk.database.windows.net:1433;databaseName=ees-db-hk;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
    username: dbmaster
    # 비밀번호는 보안상 Azure Web App의 환경변수(DB_PASSWORD)에서 가져옵니다.
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
