<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/layout :: layout(~{::title}, ~{::#page-content}, 'admin-api-logs', ~{}, ~{})}">

<head>
    <title>API 호출 이력 - EES 사원 평가 시스템</title>
</head>

<body>
    <div id="page-content" class="container-fluid py-4" data-bs-theme="dark">

        <!-- Page Header -->
        <div class="row align-items-center mb-4">
            <div class="col">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-2">
                        <li class="breadcrumb-item">
                            <a th:href="@{/}" class="text-primary text-decoration-none">대시보드</a>
                        </li>
                        <li class="breadcrumb-item active text-muted">API 호출 이력</li>
                    </ol>
                </nav>
                <h1 class="fw-bold fs-3 mb-0">
                    <i class="bi bi-journal-text me-2 text-primary"></i>API 호출 이력
                </h1>
            </div>
        </div>

        <!-- 통계 카드 -->
        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-lg-3">
                <div class="ees-card p-4 text-center">
                    <div class="fs-1 fw-bold text-white"
                         th:text="${#lists.size(logs)}">0</div>
                    <div class="text-muted small mt-1">전체 기록</div>
                </div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="ees-card p-4 text-center">
                    <div class="fs-1 fw-bold text-success"
                         th:text="${#lists.size(logs.?[resultCode == 'SUCCESS'])}">0</div>
                    <div class="text-muted small mt-1">성공</div>
                </div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="ees-card p-4 text-center">
                    <div class="fs-1 fw-bold text-danger"
                         th:text="${#lists.size(logs.?[resultCode == 'ERROR'])}">0</div>
                    <div class="text-muted small mt-1">에러</div>
                </div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="ees-card p-4 text-center">
                    <div class="fs-1 fw-bold text-info"
                         th:text="${#lists.size(logs.?[httpMethod == 'POST'])}">0</div>
                    <div class="text-muted small mt-1">POST 요청</div>
                </div>
            </div>
        </div>

        <!-- 테이블 카드 -->
        <div class="ees-card p-4">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="fw-bold mb-0">
                    <i class="bi bi-table me-2 text-primary"></i>상세 이력
                </h5>
                <!-- 검색 -->
                <div class="input-group" style="max-width:280px;">
                    <span class="input-group-text bg-dark border-secondary text-muted">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" id="api-log-search"
                           class="form-control bg-dark bg-opacity-25 border-secondary border-opacity-50 text-white"
                           placeholder="URL / IP / 사번 검색...">
                </div>
            </div>

            <div class="table-responsive">
                <table class="ees-table" id="api-log-table">
                    <thead>
                        <tr style="border-color:rgba(255,255,255,0.1);">
                            <th class="text-muted small fw-semibold">#</th>
                            <th class="text-muted small fw-semibold">일시</th>
                            <th class="text-muted small fw-semibold">Method</th>
                            <th class="text-muted small fw-semibold">API URL</th>
                            <th class="text-muted small fw-semibold">결과</th>
                            <th class="text-muted small fw-semibold">사번</th>
                            <th class="text-muted small fw-semibold">IP 주소</th>
                            <th class="text-muted small fw-semibold">요청 내용</th>
                        </tr>
                    </thead>
                    <tbody id="api-log-tbody">
                        <tr th:if="${#lists.isEmpty(logs)}">
                            <td colspan="8" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                API 호출 이력이 없습니다.
                            </td>
                        </tr>
                        <tr th:each="log, stat : ${logs}"
                            style="border-color:rgba(255,255,255,0.06);">
                            <td class="text-muted small" th:text="${stat.count}">1</td>
                            <td class="small text-white-50"
                                th:text="${log.createdAt != null ?
                                    #temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</td>
                            <td>
                                <span th:if="${log.httpMethod == 'POST'}"
                                      class="ees-badge ees-badge-performance">POST</span>
                                <span th:if="${log.httpMethod == 'GET'}"
                                      class="ees-badge ees-badge-self">GET</span>
                                <span th:unless="${log.httpMethod == 'POST' or log.httpMethod == 'GET'}"
                                      class="ees-badge ees-badge-multi"
                                      th:text="${log.httpMethod}">-</span>
                            </td>
                            <td class="small fw-semibold font-monospace"
                                th:text="${log.apiUrl}">-</td>
                            <td>
                                <span th:if="${log.resultCode == 'SUCCESS'}"
                                      class="ees-badge ees-badge-self">
                                    <i class="bi bi-check-circle-fill"></i>성공
                                </span>
                                <span th:if="${log.resultCode == 'ERROR'}"
                                      class="ees-badge" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;">
                                    <i class="bi bi-x-circle-fill"></i>에러
                                </span>
                                <span th:unless="${log.resultCode == 'SUCCESS' or log.resultCode == 'ERROR'}"
                                      class="ees-badge ees-badge-performance"
                                      th:text="${log.resultCode}">-</span>
                            </td>
                            <td class="small text-white-50"
                                th:text="${log.createdBy ?: '-'}">-</td>
                            <td class="small text-white-50 font-monospace"
                                th:text="${log.ipAddress ?: '-'}">-</td>
                            <td class="small text-muted"
                                style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;"
                                th:text="${log.requestContent ?: '-'}"
                                title="클릭하여 전체 내용 보기"
                                onclick="showRequestDetail(this)">-</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 요청 내용 상세 모달 -->
        <div class="modal fade" id="requestDetailModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
                <div class="modal-content bg-dark border-secondary">
                    <div class="modal-header border-secondary">
                        <h5 class="modal-title text-white">
                            <i class="bi bi-code-square me-2 text-primary"></i>요청 내용 상세
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <pre id="requestDetailContent"
                             class="text-white-50 font-monospace small p-3 rounded"
                             style="background:rgba(0,0,0,0.3);white-space:pre-wrap;word-break:break-all;max-height:60vh;overflow-y:auto;"></pre>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // 실시간 테이블 필터
            document.getElementById('api-log-search').addEventListener('input', function() {
                const q = this.value.toLowerCase();
                document.querySelectorAll('#api-log-tbody tr').forEach(tr => {
                    tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
                });
            });

            // 요청 내용 클릭 시 모달로 전체 JSON 표시
            function showRequestDetail(td) {
                const raw = td.textContent.trim();
                if (!raw || raw === '-') return;
                try {
                    const formatted = JSON.stringify(JSON.parse(raw), null, 2);
                    document.getElementById('requestDetailContent').textContent = formatted;
                } catch (e) {
                    document.getElementById('requestDetailContent').textContent = raw;
                }
                new bootstrap.Modal(document.getElementById('requestDetailModal')).show();
            }
        </script>
    </div>
</body>
</html>
