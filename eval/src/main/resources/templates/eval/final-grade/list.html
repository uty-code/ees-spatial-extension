<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/layout :: layout(~{::title}, ~{::#page-content}, ${activeMenu ?: 'final-grade'}, ~{::style}, ~{})}">

<head>
    <title>최종 등급 확정 - EES</title>
    <style></style>
</head>

<body>
    <div id="page-content" class="container-fluid py-4" th:fragment="content">
        <style>
            .eval-list-container {
                background: var(--glass);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-radius: 1rem;
                box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
                border: 1px solid var(--glass-border);
                overflow: hidden;
                margin-top: 20px;
            }

            .eval-list-item {
                display: flex;
                align-items: center;
                padding: 18px 24px;
                border-bottom: 1px solid var(--glass-border);
                transition: background-color 0.2s ease;
            }

            .eval-list-item:last-child {
                border-bottom: none;
            }

            .eval-list-item:hover {
                background-color: rgba(255, 255, 255, 0.05);
            }

            .eval-name {
                font-size: 1.1rem;
                font-weight: 700;
                color: var(--text-main);
                min-width: 140px;
            }

            .badge-dept {
                background-color: var(--surface-light);
                color: var(--text-main);
                font-size: 0.85rem;
                font-weight: 600;
                padding: 4px 12px;
                border-radius: 6px;
                margin-right: 16px;
                border: 1px solid var(--glass-border);
            }

            .badge-status {
                background-color: rgba(245, 158, 11, 0.2);
                color: #fbd38d;
                border: 1px solid rgba(245, 158, 11, 0.3);
                font-size: 0.85rem;
                font-weight: 600;
                padding: 4px 12px;
                border-radius: 6px;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }
        </style>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="text-white fs-3 mb-1"><i class="bi bi-check-all text-primary me-2"></i>최종 등급 확정</h1>
                <p class="text-muted mb-0 small">배정된 인원에 대한 성과 및 역량 최종 등급을 확정해주세요.</p>
            </div>
            <div>
                <form th:action="@{/eval/final-grade}" method="get"
                    class="d-inline-flex gap-2 align-items-center bg-dark p-2 rounded-pill shadow-sm"
                    style="border: 1px solid var(--glass-border);">
                    <select name="periodId"
                        class="form-select form-select-sm bg-transparent text-white border-0 fw-bold"
                        onchange="this.form.submit()" style="width: 200px; box-shadow: none;">
                        <option class="bg-dark" th:each="p : ${periods}" th:value="${p.periodId()}"
                            th:text="${'[' + p.periodYear() + '] ' + p.periodName()}"
                            th:selected="${selectedPeriod?.periodId() == p.periodId()}">차수 선택</option>
                    </select>
                </form>
            </div>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-3" role="alert"
            style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; border-radius: 0.75rem;">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <div th:text="${errorMessage}"></div>
        </div>

        <div sec:authorize="hasAnyRole('EXECUTIVE', 'ADMIN')" th:if="${selectedPeriod != null}">
            
            <div th:if="${infoMessage}"
                class="alert alert-info bg-info bg-opacity-10 border-info border-opacity-25 text-info alert-dismissible fade show mb-4"
                role="alert" style="border-radius: 0.75rem;">
                <i class="bi bi-info-circle-fill me-2"></i>
                <span th:text="${infoMessage}"></span>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${selectedPeriod.statusCode() != 'PLANNED'}">
                <h5 class="text-white fw-bold mb-3 mt-2"><i class="bi bi-people-fill text-primary me-2"></i>최종 등급 확정 대상자</h5>
                
                <div th:if="${tasks == null || tasks.isEmpty()}"
                    class="ees-card text-center py-4 border-0 shadow-sm rounded-3 mb-4">
                    <i class="bi bi-inbox fs-1 text-muted mb-3 d-block"></i>
                    <h5 class="fw-bold text-white">확정 대상자가 없습니다.</h5>
                </div>
                
                <div th:if="${tasks != null && !tasks.isEmpty()}" class="ees-card mb-5 mt-0">
                    <div th:each="task : ${tasks}" class="eval-list-item">
                        <div class="eval-name" th:text="${task.evaluateeName()}">대상자 이름</div>
                        <div class="badge-dept">소속팀</div>
                        
                        <div th:if="${teamSubmittedMap == null || !teamSubmittedMap.getOrDefault(task.mappingId(), false)}"
                            class="badge-status">
                            <i class="bi bi-hourglass-split"></i> 확정 대기
                        </div>
                        <div th:if="${teamSubmittedMap != null && teamSubmittedMap.getOrDefault(task.mappingId(), false)}"
                            class="badge-status"
                            style="background:rgba(34,197,94,0.15);color:#86efac;border-color:rgba(34,197,94,0.3);">
                            <i class="bi bi-check-circle-fill"></i> 확정 완료
                        </div>
                        
                        <div class="flex-grow-1"></div>
                        
                        <div>
                            <!-- 가중치가 유효하고 자가평가가 완료된 경우에만 평가 작성 가능 -->
                            <a th:if="${evaluateeSelfSubmittedMap != null && evaluateeSelfSubmittedMap.getOrDefault(task.mappingId(), false) && teamWeightValidMap != null && teamWeightValidMap.getOrDefault(task.mappingId(), false)}"
                                href="#" class="btn ees-btn-glass-primary btn-sm"
                                th:attr="hx-get=@{/eval/final-grade/form(mappingId=${task.mappingId()})}"
                                hx-target="#page-content" hx-select="#page-content" hx-swap="outerHTML"
                                hx-push-url="true">
                                <i class="bi bi-pencil-square"></i> <span
                                    th:text="${teamSubmittedMap != null && teamSubmittedMap.getOrDefault(task.mappingId(), false)} ? '확정 내용 수정' : '등급 확정 시작'"></span>
                            </a>
                            
                            <!-- 가중치 미설정 -->
                            <button
                                th:if="${teamWeightValidMap == null || !teamWeightValidMap.getOrDefault(task.mappingId(), false)}"
                                class="btn-evaluate"
                                style="background-color: #92400e; cursor: not-allowed; opacity: 0.7;" disabled
                                title="해당 대상자의 부서별 가중치 합계가 100%가 아닙니다">
                                <i class="bi bi-lock-fill"></i> 가중치 미설정
                            </button>
                            
                            <!-- 자가평가 대기중 (가중치는 유효하지만 자가평가 미제출) -->
                            <button
                                th:if="${teamWeightValidMap != null && teamWeightValidMap.getOrDefault(task.mappingId(), false) && (evaluateeSelfSubmittedMap == null || !evaluateeSelfSubmittedMap.getOrDefault(task.mappingId(), false))}"
                                class="btn-evaluate"
                                style="background-color: #4b5563; cursor: not-allowed; opacity: 0.7;" disabled>
                                <i class="bi bi-lock-fill"></i> 자가평가 대기중
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 평가 시작 전인 경우의 대체 화면 -->
            <div th:if="${selectedPeriod.statusCode() == 'PLANNED'}" class="ees-card p-5 text-center text-muted">
                <i class="bi bi-clock-history fs-1 mb-3 d-block opacity-25 text-info"></i>
                <h5 class="fw-bold text-white mb-2">평가 준비 중</h5>
                <p class="mb-0 text-muted">현재 차수는 평가 항목 구성 및 정합성 검토 중입니다.<br>평가가 시작되면 대상자 리스트가 활성화됩니다.</p>
            </div>
        </div>
    </div>
</body>
</html>
