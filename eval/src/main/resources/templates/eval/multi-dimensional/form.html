<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(~{::title}, ~{::#page-content}, 'multi-dimensional-eval', ~{::style}, ~{})}">
<head>
    <title>다면 평가 작성 - EES</title>
<body>
<div id="page-content" class="container-fluid py-4" th:fragment="content">
    <style>
        .eval-form-container { max-width: 1200px; margin: 0 auto; }
        .eval-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 8px;
            box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-left: 4px solid var(--info);
            padding: 24px 30px;
            margin-bottom: 20px;
        }
        .eval-card.submitted {
            border-left-color: #22c55e;
        }
        .eval-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .eval-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .eval-title i { color: var(--info); }
        .weight-badge {
            background-color: rgba(255,255,255,0.05);
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 4px;
        }
        .field-label {
            color: var(--info);
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .eval-textarea {
            width: 100%;
            border: 1px solid var(--glass-border);
            background-color: rgba(0,0,0,0.15);
            border-radius: 6px;
            padding: 14px 16px;
            font-size: 0.95rem;
            color: var(--text-main);
            min-height: 120px;
            resize: vertical;
        }
        .eval-textarea:focus {
            outline: none;
            border-color: var(--info);
            background-color: rgba(0,0,0,0.25);
            box-shadow: 0 0 0 3px rgba(0,255,255,0.1);
        }
    </style>
    <div class="eval-form-container">

        <!-- 상단 헤더 -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center gap-3">
                <h1 class="text-white fw-bold fs-3 mb-0">다면 평가 작성</h1>
                <span class="badge bg-info text-dark px-3 py-2 fs-6" th:text="${mapping.evaluateeName()}">피평가자(부서장)</span>
            </div>
            <a href="#" class="btn ees-btn-glass"
               hx-get="/eval/multi-dimensional" hx-target="#page-content" hx-select="#page-content" hx-swap="outerHTML show:window:top" hx-push-url="true">
                <i class="bi bi-arrow-left"></i> 목록으로 돌아가기
            </a>
        </div>

        <div class="p-3 mb-4 d-flex align-items-start gap-3" 
             style="background: rgba(0, 188, 212, 0.1); border: 1px solid rgba(0, 188, 212, 0.2); border-radius: 12px;">
            <i class="bi bi-info-circle-fill fs-4 text-info mt-1"></i>
            <div>
                <div class="fw-bold text-white mb-1">다면 평가 유의사항</div>
                <div class="text-muted small">
                    부서장의 리더십, 소통 능력, 공정성 등에 대해 객관적이고 솔직한 평가를 부탁드립니다. 작성하신 내용은 익명으로 처리됩니다.
                </div>
            </div>
        </div>

        <!-- 메시지 영역 -->
        <div th:if="${successMessage}" class="alert alert-success bg-opacity-10 mb-3" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${submitted}" class="alert alert-info bg-opacity-10 mb-3" role="alert">
            <i class="bi bi-patch-check-fill me-2"></i>
            <span>평가가 제출되었습니다. 수정 후 다시 제출할 수 있습니다.</span>
        </div>

        <!-- 평가요소 없을 때 -->
        <div th:if="${elements == null || elements.isEmpty()}" class="ees-card text-center py-5">
            <i class="bi bi-exclamation-circle fs-1 text-warning mb-3 d-block"></i>
            <h5 class="text-white fw-bold">등록된 다면평가 요소가 없습니다.</h5>
        </div>

        <!-- 평가 폼 -->
        <form th:if="${elements != null && !elements.isEmpty()}" id="evaluationForm"
              th:action="@{/eval/multi-dimensional/submit}" method="post">
            <input type="hidden" name="mappingId" th:value="${mappingId}">

            <div th:each="element : ${elements}"
                 th:class="${savedMap != null and savedMap.containsKey(element.elementId())} ? 'eval-card submitted' : 'eval-card'">
                <div class="eval-card-header">
                    <div class="eval-title">
                        <i class="bi bi-person-check-fill"></i>
                        <span th:text="${element.elementName()}">리더십</span>
                    </div>
                    <div class="weight-badge">
                        가중치 <span th:text="${element.weight() + '%'}"></span>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-md-3">
                        <div class="field-label mb-2">
                            <i class="bi bi-award-fill"></i> 점수 (0~100점)
                        </div>
                        <input type="number" class="eval-textarea text-center fs-4 fw-bold" style="min-height: 60px;"
                               th:name="'score_' + ${element.elementId()}"
                               th:value="${savedMap != null and savedMap.containsKey(element.elementId()) ? savedMap.get(element.elementId()).getScore() : ''}"
                               min="0" th:max="${element.maxScore()}" step="0.1" 
                               required>
                    </div>
                    <div class="col-md-9">
                        <div class="field-label mb-2">
                            <i class="bi bi-chat-left-text-fill"></i> 구체적인 사유 및 코멘트
                        </div>
                        <textarea class="eval-textarea" th:name="'comment_' + ${element.elementId()}"
                                  placeholder="평가 사유를 구체적으로 작성해주세요."
                                  required th:text="${savedMap != null and savedMap.containsKey(element.elementId()) ? savedMap.get(element.elementId()).getComments() : ''}"></textarea>
                    </div>
                </div>
            </div>

            <!-- 하단 버튼 -->
            <div class="d-flex justify-content-end mt-4 mb-5">
                <button type="submit" class="btn ees-btn-glass-primary btn-lg py-3 px-5 fs-5">
                    <i class="bi bi-check2-circle me-2"></i> 다면평가 제출하기
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
