<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/layout :: layout(~{::title}, ~{::#page-content}, 'my-evaluation', ~{}, ~{})}">

<head>
    <title>나의 자가평가 - EES</title>
</head>

<body>
    <div id="page-content" class="container-fluid py-4">
        <!-- Page Header -->
        <div class="ees-card p-4 mb-4">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1 class="fw-bold fs-3 mb-1 ees-text-gradient">나의 자가평가 대시보드</h1>
                    <p class="text-muted">이번 차수 나의 성과와 역량을 직접 진단하고 목표 달성도를 기록합니다.</p>
                </div>
                <div class="col-md-4 text-md-end">
                    <form method="get" th:action="@{/eval/my-evaluation/list}" class="d-inline-block">
                        <select name="periodId" class="form-select ees-form-control ees-form-select" onchange="this.form.submit()">
                            <option th:each="p : ${periods}" 
                                    th:value="${p.periodId()}" 
                                    th:text="${p.periodName()}"
                                    th:selected="${p.periodId() == selectedPeriodId}">차수 선택</option>
                        </select>
                    </form>
                </div>
            </div>
        </div>

        <div th:if="${selectedPeriodId != null}">
            <!-- Progress Overview -->
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="ees-card p-4 text-center">
                        <div class="ees-badge ees-badge-performance mb-2">성과 비중</div>
                        <h2 class="fw-bold mb-0" th:text="${#numbers.formatDecimal(perfWeight, 1, 0)} + '%'">0%</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="ees-card p-4 text-center">
                        <div class="ees-badge ees-badge-competency mb-2">역량 비중</div>
                        <h2 class="fw-bold mb-0" th:text="${#numbers.formatDecimal(compWeight, 1, 0)} + '%'">0%</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="ees-card p-4 text-center">
                        <div class="ees-badge ees-badge-multi mb-2">총 가중치</div>
                        <h2 class="fw-bold mb-0" th:text="${#numbers.formatDecimal(perfWeight + compWeight, 1, 0)} + '%'">0%</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="ees-card p-4 text-center" style="border-color: rgba(99, 102, 241, 0.4);">
                        <div class="ees-badge ees-badge-self mb-2">현재 진행</div>
                        <h2 class="fw-bold mb-0" th:text="${completedCount} + '/' + ${totalCount}">0/0</h2>
                    </div>
                </div>
            </div>

            <!-- Evaluation Elements List -->
            <div class="ees-card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold mb-0"><i class="bi bi-journal-check me-2 text-primary"></i>평가 항목 리스트</h5>
                </div>

                <div class="table-responsive">
                    <table class="ees-table align-middle">
                        <thead>
                            <tr>
                                <th style="width: 15%">유형</th>
                                <th style="width: 40%">평가 요소명</th>
                                <th style="width: 15%" class="text-center">배점(비중)</th>
                                <th style="width: 15%" class="text-center">상태</th>
                                <th style="width: 15%" class="text-end">평가하기</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${evaluationItems}">
                                <td>
                                    <span th:if="${item.elementTypeCode() == 'PERFORMANCE'}" class="ees-badge ees-badge-performance">성과</span>
                                    <span th:if="${item.elementTypeCode() == 'COMPETENCY'}" class="ees-badge ees-badge-competency">역량</span>
                                </td>
                                <td>
                                    <div class="fw-bold" th:text="${item.elementName()}">의사소통 및 협업</div>
                                </td>
                                <td class="text-center fw-bold text-info" th:text="${#numbers.formatDecimal(item.weight(), 1, 0)} + '%'">10%</td>
                                <td class="text-center">
                                    <span th:if="${item.isCompleted()}" class="ees-badge ees-badge-self">완료</span>
                                    <span th:if="${!item.isCompleted()}" class="ees-badge ees-badge-multi" style="background: rgba(108, 117, 125, 0.1); color: #adb5bd;">대기</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/eval/my-evaluation/item/{id}(id=${item.elementId()}, periodId=${selectedPeriodId})}" 
                                       class="btn ees-btn-glass btn-sm">
                                        <i class="bi bi-pencil-square me-1"></i> 진입
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(evaluationItems)}">
                                <td colspan="5" class="text-center py-5 text-muted">등록된 평가 항목이 없습니다.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:if="${selectedPeriodId == null}" class="ees-card p-5 text-center text-muted">
            <i class="bi bi-calendar-x fs-1 mb-3 d-block opacity-25"></i>
            조회할 평가 차수를 선택해 주세요.
        </div>
    </div>
</body>

</html>
